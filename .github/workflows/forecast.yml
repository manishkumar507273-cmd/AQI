name: Hourly AQI Forecast Engine

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Check for requirements in root or backend/
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          
          # Explicitly install required modules (using lightweight CPU-only PyTorch)
          pip install numpy pandas scikit-learn supabase
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Forecast Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONPATH: .
        run: |
          python backend/services/forecast_engine.py
