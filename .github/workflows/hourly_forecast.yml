name: Hourly AQI Forecast Job

on:
  schedule:
    # Runs at the start of every hour (e.g. 1:00, 2:00, 3:00...)
    - cron: '0 * * * *'
  # Allows you to click "Run workflow" manually from GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  run-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (Lightweight CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install keras joblib scikit-learn numpy httpx python-dotenv

      - name: Run 24-Hour Forecast Engine
        env:
          KERAS_BACKEND: "torch"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://sgkdpliqlhgiqsabxzxe.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNna2RwbGlxbGhnaXFzYWJ4enhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NzgzMTIsImV4cCI6MjEwMDQ1NDMxMn0.vMtbXomFdmOcBkhhSoiyYyp_vFxOhg4MYCFCw9-pL30' }}
          SOURCE_AQI_TABLE: "AQI_NODE1"
          DEST_FORECAST_TABLE: "aqi_forecasts_24h"
          NODE_ID: "node_1"
          ARTIFACTS_DIR: "AQI-prediction-new"
        run: |
          python backend/services/forecast_engine.py

      - name: Run Sensor Health & Data Downtime Alert Sentinel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://sgkdpliqlhgiqsabxzxe.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNna2RwbGlxbGhnaXFzYWJ4enhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NzgzMTIsImV4cCI6MjEwMDQ1NDMxMn0.vMtbXomFdmOcBkhhSoiyYyp_vFxOhg4MYCFCw9-pL30' }}
          ALERT_RECIPIENT_EMAILS: ${{ secrets.ALERT_RECIPIENT_EMAILS || 'manish.23cs065@sode-edu.in' }}
          ALERT_THRESHOLD_MINUTES: "30"
          ALERT_COOLDOWN_HOURS: "24"
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python backend/services/alert_sentinel.py
